<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NALB Residence – Carte de visite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2A6B;--deep:#071c4a;--blue:#1565C8;--sky:#7FB3F0;--gold:#F5A100;--ink:#2A2D3E;--white:#fff;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#12408f 0%,var(--navy) 45%,var(--deep) 100%);font-family:var(--sans);color:var(--white);display:flex;justify-content:center;padding:20px 14px 32px}
.card{width:100%;max-width:420px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#0c3380,var(--deep));border:1px solid rgba(245,161,0,.55);box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.04);animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.top{position:relative;background:var(--white);padding:26px 24px 8px;text-align:center}
.top img{width:230px;max-width:70%;height:auto;display:block;margin:0 auto}
.top svg{display:block;width:100%;height:46px;margin-top:-6px}
.id{text-align:center;padding:6px 24px 4px}
.id h1{font-family:var(--serif);font-weight:700;font-size:2.1rem;letter-spacing:.06em;margin:0;line-height:1.1}
.id p{margin:6px 0 0;color:var(--sky);font-size:.95rem;letter-spacing:.14em}
.rule{width:64px;height:2px;background:var(--gold);margin:16px auto 0;border-radius:2px}
.body{padding:18px 20px 22px}
h2{font-family:var(--serif);font-size:1.15rem;font-weight:600;color:var(--gold);margin:20px 0 10px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);background:rgba(255,255,255,.07);border:1px solid rgba(127,179,240,.35);border-radius:14px;padding:13px 12px;font-size:.92rem;font-weight:500;transition:background .2s,border-color .2s,transform .2s}
.btn:hover,.btn:focus-visible{background:rgba(245,161,0,.16);border-color:var(--gold)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{flex:none;width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.full{grid-column:1/-1}
.wa{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:600}
.wa svg{stroke:var(--deep)}
.wa:hover,.wa:focus-visible{background:#ffb81f;border-color:#ffb81f}
.stack{display:grid;gap:10px}
.btn small{display:block;font-size:.72rem;color:var(--sky);font-weight:400}
.wa small{color:#4a3500}
.foot{text-align:center;color:var(--sky);font-size:.78rem;padding:4px 20px 22px;letter-spacing:.08em}
.qr{margin:22px auto 4px;width:176px;padding:8px;background:#fff;border-radius:16px;border:2px solid var(--gold)}.qr svg{display:block;width:100%;height:auto}.qrcap{text-align:center;color:var(--sky);font-size:.82rem;margin:10px 0 0}
</style>
</head>
